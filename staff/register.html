<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff register · MSA Stay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/staff.css" />
    <link rel="icon" href="../assets/favicon.ico" sizes="any" />
    <meta name="theme-color" content="#3C6169" />
  </head>
  <body>
    <header class="staff-header">
      <a class="staff-brand" href="../index.html"
        ><img
          class="staff-logo"
          src="../assets/logo.png"
          alt="MSA Stay"
          width="160"
          height="36"
        /><span class="staff-brand-label">Staff</span></a
      >
    </header>

    <main class="staff-main staff-main--narrow">
      <h1>Create staff account</h1>
      <p class="muted" id="intro">
        The first account becomes an admin (full access). Later accounts are
        staff (view + own schedule) until a manager or admin promotes them.
      </p>
      <p class="status" id="status"></p>

      <section class="panel">
        <form class="auth-form" id="register-form">
          <label>
            Name
            <input type="text" id="name" required autocomplete="name" />
          </label>
          <label>
            Email
            <input type="email" id="email" required autocomplete="username" />
          </label>
          <label>
            Password
            <input
              type="password"
              id="password"
              required
              autocomplete="new-password"
              minlength="8"
            />
          </label>
          <label id="invite-wrap" hidden>
            Invite code
            <input type="text" id="invite" autocomplete="off" />
          </label>
          <button class="btn btn-primary" type="submit">Register</button>
        </form>
      </section>

      <p class="muted">
        Already registered? <a href="login.html">Sign in</a>
      </p>
    </main>

    <script src="js/staff-common.js"></script>
    <script>
      (async function () {
        const status = document.getElementById("status");
        const intro = document.getElementById("intro");
        const inviteWrap = document.getElementById("invite-wrap");

        try {
          const me = await MSAStaff.api("/api/staff/me");
          if (me.user) {
            location.href = "calendar.html";
            return;
          }
          if (me.inviteRequired) {
            inviteWrap.hidden = false;
            document.getElementById("invite").required = true;
          }
          if (me.firstUser) {
            intro.textContent =
              "You are creating the first staff account — it will be an admin with full access.";
          } else {
            intro.textContent =
              "New accounts are staff. Ask a manager or admin if you need edit access later.";
          }
        } catch (_) {}

        document
          .getElementById("register-form")
          .addEventListener("submit", async function (event) {
            event.preventDefault();
            MSAStaff.setStatus(status, "Creating account…");
            try {
              await MSAStaff.api("/api/staff/register", {
                method: "POST",
                body: JSON.stringify({
                  name: document.getElementById("name").value,
                  email: document.getElementById("email").value,
                  password: document.getElementById("password").value,
                  inviteCode: document.getElementById("invite").value,
                }),
              });
              location.href = "calendar.html";
            } catch (err) {
              MSAStaff.setStatus(status, err.message, "err");
            }
          });
      })();
    </script>
  </body>
</html>
