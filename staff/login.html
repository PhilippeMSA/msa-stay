<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff sign in · MSA Stay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/staff.css" />
    <link rel="icon" href="../assets/favicon.ico" sizes="any" />
    <meta name="theme-color" content="#3C6169" />
  </head>
  <body>
    <header class="staff-header">
      <a class="staff-brand" href="../index.html"
        ><img
          class="staff-logo"
          src="../assets/logo.png"
          alt="MSA Stay"
          width="160"
          height="36"
        /><span class="staff-brand-label">Staff</span></a
      >
    </header>

    <main class="staff-main staff-main--narrow">
      <h1>Staff sign in</h1>
      <p class="muted">Access the availability calendar for your team.</p>
      <p class="status" id="status"></p>

      <section class="panel">
        <form class="auth-form" id="login-form">
          <label>
            Email
            <input type="email" id="email" required autocomplete="username" />
          </label>
          <label>
            Password
            <input
              type="password"
              id="password"
              required
              autocomplete="current-password"
              minlength="8"
            />
          </label>
          <button class="btn btn-primary" type="submit">Sign in</button>
        </form>
      </section>

      <p class="muted">
        No account yet? <a href="register.html">Register</a>
      </p>
    </main>

    <script src="js/staff-common.js"></script>
    <script>
      (async function () {
        const status = document.getElementById("status");
        const params = new URLSearchParams(location.search);
        const next = params.get("next") || "calendar.html";

        try {
          const me = await MSAStaff.api("/api/staff/me");
          if (me.user) {
            location.href = next;
            return;
          }
        } catch (_) {}

        document
          .getElementById("login-form")
          .addEventListener("submit", async function (event) {
            event.preventDefault();
            MSAStaff.setStatus(status, "Signing in…");
            try {
              await MSAStaff.api("/api/staff/login", {
                method: "POST",
                body: JSON.stringify({
                  email: document.getElementById("email").value,
                  password: document.getElementById("password").value,
                }),
              });
              location.href = next;
            } catch (err) {
              MSAStaff.setStatus(status, err.message, "err");
            }
          });
      })();
    </script>
  </body>
</html>
